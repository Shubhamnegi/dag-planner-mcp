[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dag-planner-mcp"
version = "0.1.0"
description = "A durable DAG-based planner MCP utility for agent orchestration"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.6.0",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "jsonschema>=4.0",
    "aiosqlite>=0.19",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
dashboard = [
    "streamlit>=1.35",
    "graphviz>=0.20",
    "pandas>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio>=4.0",
    "httpx>=0.27",
]

[project.scripts]
dag-planner-mcp = "dag_planner_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dag_planner_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
